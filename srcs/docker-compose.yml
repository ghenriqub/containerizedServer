name: inception

services:

  # ========================================================================== #
  #  MariaDB - database backend                                                #
  # ========================================================================== #
  mariadb:
    build:
      context: ./requirements/mariadb
      provenance: false
      sbom: false
    image: mariadb:inception
    container_name: mariadb
    restart: always
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    expose:
      - "3306"

  # ========================================================================== #
  #  WordPress + php-fpm - application layer                                   #
  # ========================================================================== #
  wordpress:
    build:
      context: ./requirements/wordpress
      provenance: false
      sbom: false
    image: wordpress:inception
    container_name: wordpress
    restart: always
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_password
      - credentials
      - wp_user_password
      - redis_password
    expose:
      - "9000"

  # ========================================================================== #
  #  NGINX - TLS termination, sole entrypoint of the infrastructure            #
  # ========================================================================== #
  nginx:
    build:
      context: ./requirements/nginx
      provenance: false
      sbom: false
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx:inception
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    networks:
      inception:
        aliases:
          - ${DOMAIN_NAME}
          - adminer.${DOMAIN_NAME}
          - uptime.${DOMAIN_NAME}
          - website.${DOMAIN_NAME}
    volumes:
      - wordpress_data:/var/www/html:ro
    ports:
      - "443:443"

  # ========================================================================== #
  #  BONUS                                                                     #
  # ========================================================================== #

  # ---- Redis ----
  redis:
    build:
      context: ./requirements/bonus/redis
      provenance: false
      sbom: false
    image: redis:inception
    container_name: redis
    profiles: [bonus]
    restart: always
    networks:
      - inception
    secrets:
      - redis_password
    expose:
      - "6379"

  # ---- Adminer ----
  adminer:
    build:
      context: ./requirements/bonus/adminer
      provenance: false
      sbom: false
    image: adminer:inception
    container_name: adminer
    profiles: [bonus]
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception
    expose:
      - "9000"

  # ---- Uptime Kuma ----
  uptime-kuma:
    init: true
    build:
      context: ./requirements/bonus/uptime-kuma
      provenance: false
      sbom: false
    image: uptime-kuma:inception
    container_name: uptime-kuma
    profiles: [bonus]
    restart: always
    networks:
      - inception
    volumes:
      uptime_kuma_data:
        driver: local
        driver_opts:
          type: none
          o: bind
          device: ${DATA_PATH}/uptime-kuma
    secrets:
      - kuma_password
    expose:
      - "3001"  
    environment:
      - UPTIME_KUMA_DB_TYPE=sqlite

# ---- Website ----
  website:
    build:
      context: ./requirements/bonus/website
      provenance: false
      sbom: false
    image: website:inception
    container_name: website
    profiles: [bonus]
    restart: always
    networks:
      - inception
    expose:
      - "8080"
  
# ---- FTP ----
  ftp:
    build:
      context: ./requirements/bonus/ftp
      provenance: false
      sbom: false
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
        FTP_USER: ${FTP_USER}
    image: ftp:inception
    container_name: ftp
    profiles: [bonus]
    restart: always
    depends_on:
      - wordpress
    env_file: .env
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "30000-30009:30000-30009"

# ============================================================================ #
#  Network                                                                     #
# ============================================================================ #
networks:
  inception:
    driver: bridge

# ============================================================================ #
#  Named volumes                                                               #
# ============================================================================ #
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

# ============================================================================ #
#  Secrets                                                                     #
# ============================================================================ #
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
  kuma_password:
    file: ../secrets/kuma_password.txt
